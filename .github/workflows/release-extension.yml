name: Build Chrome extension release

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension integration
        run: npm test

      - name: Build production extension
        run: npm run build:production

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          grep -R "https://charcha.example.com" dist >/dev/null
          if grep -R "charcha.example.com" dist; then
            echo "Legacy production domain found in release bundle"
            exit 1
          fi

      - name: Package Chrome Web Store ZIP
        run: |
          cd dist
          zip -qr ../charcha-ai-extension.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: charcha-ai-extension-${{ github.ref_name }}
          path: charcha-ai-extension.zip
          if-no-files-found: error
          retention-days: 30
