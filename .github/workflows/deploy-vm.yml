name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "integrations/figjam/**"
      - "tools/package-figjam-plugin.py"
      - "src/**"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/release-extension.yml"
      - "docker-compose.prod.yml"
      - "nginx/**"
      - ".github/workflows/deploy-vm.yml"
      - "tools/deploy.sh"
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Check live services and run a synthetic model probe without deploying"
        type: boolean
        default: false
      no_cache:
        description: "Rebuild every image from scratch (ignores the build cache)"
        type: boolean
        default: false
      reseed_demo:
        description: "Rebuild the synthetic demo meetings for the accounts that already have them (no deploy)"
        type: boolean
        default: false
      backup_live:
        description: "Snapshot the currently serving commit and images without deploying"
        type: boolean
        default: false

# Tests and image builds of a new push run while the previous push is still
# deploying; only the deploy job itself is one-at-a-time (see its
# concurrency below).

env:
  # Pinned by digest. Runs on the VM only during a deploy, bound to
  # 127.0.0.1 and reached through this job's SSH connection: no open port,
  # no credentials. It lets the VM pull only the image layers that changed.
  DEPLOY_REGISTRY_IMAGE: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8

jobs:
  backup-live:
    if: github.event_name == 'workflow_dispatch' && inputs.backup_live
    runs-on: ubuntu-latest
    env:
      VM: ${{ secrets.CHARCHA_VM_USER }}@${{ secrets.CHARCHA_VM_HOST }}
    steps:
      - name: Preserve the live commit and service images
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CHARCHA_VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "${{ secrets.CHARCHA_VM_HOST }}" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/charcha
            backup="$HOME/.deploy-backups/pre-signal-room-20261115"
            mkdir -p "$backup"
            chmod 700 "$HOME/.deploy-backups" "$backup"
            if [ ! -f "$backup/commit" ]; then git rev-parse HEAD > "$backup/commit"; fi
            echo "Saved live commit: $(cat "$backup/commit")"
            for service in backend frontend notetaker; do
              image="charcha-$service:latest"
              saved="charcha-$service:backup-pre-signal-room-20261115"
              container=$(docker compose -f docker-compose.prod.yml ps -q "$service")
              test -n "$container" || { echo "$service is not running"; exit 1; }
              running_id=$(docker inspect -f '{{.Image}}' "$container")
              latest_id=$(docker image inspect -f '{{.Id}}' "$image")
              test "$running_id" = "$latest_id" || { echo "$service image differs from its latest tag"; exit 1; }
              if ! docker image inspect "$saved" >/dev/null 2>&1; then
                docker tag "$image" "$saved"
              fi
              saved_id=$(docker image inspect -f '{{.Id}}' "$saved")
              test "$saved_id" = "$running_id" || { echo "$service backup differs from the running image"; exit 1; }
              echo "$service $saved_id" | tee "$backup/$service.image"
            done
            chmod 600 "$backup"/*
          REMOTE

  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    env:
      VM: ${{ secrets.CHARCHA_VM_USER }}@${{ secrets.CHARCHA_VM_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Read sanitized live agent diagnostics
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CHARCHA_VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "${{ secrets.CHARCHA_VM_HOST }}" >> ~/.ssh/known_hosts
          scp -q -i ~/.ssh/id_ed25519 backend/scripts/diagnose_meeting_voice.py "$VM:voice-diagnostic.py"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" bash -s <<'REMOTE'
            bash -euo pipefail -c "$(cat)" </dev/null
            cd ~/charcha
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml ps
            tools/deploy.sh --check
            trap 'rm -f ~/voice-diagnostic.py' EXIT
            docker compose -f docker-compose.prod.yml exec -T backend python - < ~/voice-diagnostic.py
            docker compose -f docker-compose.prod.yml logs --tail=200 backend | grep -E 'Agent job failed|Agent queue unavailable|agent_timing' | tail -20 || true
            docker compose -f docker-compose.prod.yml exec -T notetaker python - <<'PYDIAG'
          import config
          print({"presentation_enabled": config.PRESENT_BOARD, "google_auth_state_present": config.AUTH_STATE_PATH.is_file()})
          print({"figma_auth_state_present": getattr(config, 'FIGMA_AUTH_STATE_PATH', config.STATE_DIR / 'figma-auth.json').is_file()})
          PYDIAG
          REMOTE

  reseed-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.reseed_demo
    runs-on: ubuntu-latest
    env:
      VM: ${{ secrets.CHARCHA_VM_USER }}@${{ secrets.CHARCHA_VM_HOST }}
    steps:
      - name: Rebuild the demo meetings on the VM
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CHARCHA_VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "${{ secrets.CHARCHA_VM_HOST }}" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" \
            'cd ~/charcha && docker compose -f docker-compose.prod.yml exec -T backend python scripts/seed_demo.py --reset --existing'

  # Nothing reaches the VM unless this passes.
  # What this push touched, so each job below does only the work it needs.
  changes:
    if: github.event_name != 'workflow_dispatch' || (!inputs.diagnostics_only && !inputs.reseed_demo && !inputs.backup_live)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      bot: ${{ steps.diff.outputs.bot }}
      frontend: ${{ steps.diff.outputs.frontend }}
      extension: ${{ steps.diff.outputs.extension }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")
          elif [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="backend/ backend/bot/ frontend/ src/ docker-compose.prod.yml"
          else
            changed=$(git diff --name-only "$before" "$GITHUB_SHA")
          fi
          has() { printf "%s\n" $changed | grep -Eq "$1" && echo true || echo false; }
          backend=$(printf "%s\n" $changed | grep -E "^backend/" | grep -Evq "^backend/bot/" && echo true || echo false)
          bot=$(has "^backend/bot/")
          frontend=$(has "^(frontend/|integrations/figjam/|tools/package-figjam-plugin.py$)")
          extension=$(has "^(src/|manifest.json|package(-lock)?.json|vite.config.js|tools/)")
          compose=$(has "^docker-compose.prod.yml$")
          images=""
          [ "$backend" = true ] || [ "$compose" = true ] && images="$images backend"
          [ "$frontend" = true ] || [ "$compose" = true ] && images="$images frontend"
          [ "$bot" = true ] || [ "$compose" = true ] && images="$images notetaker"
          images=$(echo $images | tr ' ' ',')
          { echo "backend=$backend"; echo "bot=$bot"; echo "frontend=$frontend"; echo "extension=$extension"; echo "images=$images"; } >> "$GITHUB_OUTPUT"
          echo "backend=$backend bot=$bot frontend=$frontend extension=$extension images=$images"

  test:
    needs: changes
    runs-on: ubuntu-latest
    # A newer run of the same event makes this one's checks pointless. Keep
    # late PR checks separate from main deployments after a merge.
    concurrency:
      group: test-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: charcha
          POSTGRES_PASSWORD: charcha
          POSTGRES_DB: charcha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U charcha -d charcha"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://charcha:charcha@localhost:5432/charcha
      DATABASE_SSL: "false"
      APP_ENV: development
      ADMIN_EMAILS: ci-admin@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        if: needs.changes.outputs.backend == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          pip install -q -r requirements-dev.txt
          python scripts/init_db.py
          python -m pytest tests -q --no-header -p no:warnings
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Extension checks
        if: needs.changes.outputs.extension == 'true'
        run: npm test
      - name: Frontend type check
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: Native FigJam operation checks
        if: needs.changes.outputs.frontend == 'true'
        run: node --test integrations/figjam/code.test.mjs

  # Builds every image into GitHub's layer cache at the same time as the
  # tests, so the deploy job below only replays cached layers and ships them.
  # Unchanged services rebuild from cache in seconds.
  prebuild:
    needs: changes
    # PRs validate code in test; image cache writes need the permissions of a
    # main push or manual deployment and otherwise fail after a PR is merged.
    if: needs.changes.outputs.images != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: prebuild-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images into the cache
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          POSTGRES_PASSWORD: build-only
          COMPOSE_PROJECT_NAME: charcha
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          APP_URL: ${{ vars.CHARCHA_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.CHARCHA_GOOGLE_CLIENT_ID }}
          CHROME_WEB_STORE_URL: ${{ vars.CHARCHA_CHROME_WEB_STORE_URL }}
        with:
          source: .
          files: docker-compose.prod.yml
          targets: ${{ needs.changes.outputs.images }}
          push: false
          pull: false
          no-cache: ${{ inputs.no_cache == true }}
          set: |
            *.output=type=cacheonly
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            notetaker.cache-from=type=gha,scope=notetaker
            notetaker.cache-to=type=gha,scope=notetaker,mode=max

  deploy:
    needs: [changes, test, prebuild]
    if: >-
      always() && github.event_name != 'pull_request' && needs.test.result == 'success' &&
      (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped')
    runs-on: ubuntu-latest
    # One deploy at a time: a second push waits for the first instead of
    # racing it for the VM.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    env:
      # The VM login CI uses (a dedicated key in CHARCHA_VM_SSH_KEY). The app
      # lives in ~/charcha under this user.
      VM: ${{ secrets.CHARCHA_VM_USER }}@${{ secrets.CHARCHA_VM_HOST }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CHARCHA_VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "${{ secrets.CHARCHA_VM_HOST }}" >> ~/.ssh/known_hosts && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 3
          done

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which images changed
        id: plan
        run: |
          set -euo pipefail
          deployed=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" 'git -C ~/charcha rev-parse HEAD')
          missing=$(ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "$VM" 'for s in backend frontend notetaker; do docker image inspect charcha-$s:latest >/dev/null 2>&1 || echo $s; done')
          if git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$deployed" "$GITHUB_SHA")
          else
            changed="backend/ frontend/ backend/bot/"
          fi
          build=""
          # backend/.dockerignore leaves bot/ out of the backend image.
          printf "%s\n" "$changed" | grep -E "^backend/" | grep -Evq "^backend/bot/" && build="$build backend"
          printf "%s\n" "$changed" | grep -Eq "^frontend/" && build="$build frontend"
          printf "%s\n" "$changed" | grep -Eq "^backend/bot/" && build="$build notetaker"
          for s in $missing; do case " $build " in *" $s "*) ;; *) build="$build $s";; esac; done
          # A compose change can alter how any app container runs (env,
          # limits), so every app service is restarted, each when idle.
          restart="$build"
          if printf "%s\n" "$changed" | grep -Eq "^docker-compose.prod.yml$"; then restart="backend frontend notetaker"; fi
          echo "build=$(echo $build)" >> "$GITHUB_OUTPUT"
          echo "targets=$(echo $build | tr ' ' ',')" >> "$GITHUB_OUTPUT"
          {
            echo "bake_set<<EOF"
            for t in $build; do
              echo "$t.tags=localhost:5000/charcha-$t:latest"
              echo "$t.cache-from=type=gha,scope=$t"
              echo "$t.cache-to=type=gha,scope=$t,mode=max"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "restart=$(echo $restart | tr ' ' '\n' | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Deployed: $deployed → $GITHUB_SHA | build:$build | restart:$restart"

      - name: Preserve rollback images and check the VM
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" \
            RELEASE_ID="'${{ github.run_id }}'" bash -s <<'REMOTE'
            bash -euo pipefail -c "$(cat)" </dev/null
            set -euo pipefail
            cd ~/charcha
            test -z "$(git status --porcelain)" || { echo "VM checkout has local changes; leaving it intact"; exit 1; }
            backup="$HOME/.deploy-backups/agent-$RELEASE_ID"
            mkdir -p "$backup"
            chmod 700 "$HOME/.deploy-backups" "$backup"
            if [ ! -f "$backup/commit" ]; then git rev-parse HEAD > "$backup/commit"; fi
            if [ -f backend/bot/.env ] && [ ! -f "$backup/notetaker.env" ]; then
              cp backend/bot/.env "$backup/notetaker.env"
              chmod 600 "$backup/notetaker.env"
            fi
            for service in backend frontend notetaker; do
              if ! docker image inspect "charcha-$service:rollback-$RELEASE_ID" >/dev/null 2>&1; then
                docker tag "charcha-$service:latest" "charcha-$service:rollback-$RELEASE_ID"
              fi
              docker image inspect -f '{{.Id}}' "charcha-$service:rollback-$RELEASE_ID"
            done
            tools/deploy.sh --check
            df -h /
          REMOTE

      # Images are built here on GitHub, never on the e2-medium: a Next.js and
      # Python build there stole the CPU and RAM live meetings need. Layers
      # are cached between runs and only the changed ones travel to the VM
      # (a code change moves MBs, not the 8 GB of Chrome, apt and pip).
      - name: Set up Docker Buildx
        if: steps.plan.outputs.build != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # host network: the builder pushes to the SSH tunnel on 127.0.0.1.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Open the deploy registry on the VM
        if: steps.plan.outputs.build != ''
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" \
            "docker rm -f charcha-deploy-registry >/dev/null 2>&1 || true
             docker run -d --name charcha-deploy-registry -p 127.0.0.1:5000:5000 \
               -v charcha_deploy_registry:/var/lib/registry $DEPLOY_REGISTRY_IMAGE >/dev/null"
          ssh -f -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
            -L 127.0.0.1:5000:127.0.0.1:5000 "$VM"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && exit 0; sleep 1; done
          echo "The deploy registry on the VM did not come up"; exit 1

      - name: Build images and send the changed layers
        if: steps.plan.outputs.build != ''
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          POSTGRES_PASSWORD: build-only
          COMPOSE_PROJECT_NAME: charcha
          # Baked into the web app at build time (repo Settings → Variables).
          APP_URL: ${{ vars.CHARCHA_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.CHARCHA_GOOGLE_CLIENT_ID }}
          CHROME_WEB_STORE_URL: ${{ vars.CHARCHA_CHROME_WEB_STORE_URL }}
          # One plain manifest per image (no attestation index), so the
          # registry's garbage collection can't strip part of an image.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          source: .
          files: docker-compose.prod.yml
          targets: ${{ steps.plan.outputs.targets }}
          push: true
          # Base images come from the layer cache; a rebuild with
          # workflow_dispatch no_cache picks up their updates.
          pull: false
          no-cache: ${{ inputs.no_cache == true }}
          set: ${{ steps.plan.outputs.bake_set }}

      - name: Load the new images on the VM
        if: steps.plan.outputs.build != ''
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
            "$VM" BUILD="'${{ steps.plan.outputs.build }}'" bash -s <<'REMOTE'
            bash -euo pipefail -c "$(cat)" </dev/null
            set -euo pipefail
            for s in $BUILD; do
              docker pull -q "localhost:5000/charcha-$s:latest" >/dev/null
              docker tag "localhost:5000/charcha-$s:latest" "charcha-$s:latest"
              docker image rm "localhost:5000/charcha-$s:latest" >/dev/null
              echo "charcha-$s:latest $(docker image inspect -f '{{.Id}}' charcha-$s:latest)"
            done
          REMOTE

      - name: Close the deploy registry
        if: always() && steps.plan.outputs.build != ''
        run: |
          pkill -f "ssh -f -N .*127.0.0.1:5000:127.0.0.1:5000" || true
          # Stop it, then drop layers no image uses any more so its disk use
          # stays at about one copy of the current images.
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" \
            "docker rm -f charcha-deploy-registry >/dev/null 2>&1 || true
             docker run --rm -v charcha_deploy_registry:/var/lib/registry $DEPLOY_REGISTRY_IMAGE \
               garbage-collect --delete-untagged /etc/distribution/config.yml >/dev/null" \
            || echo "::warning::Deploy registry clean-up failed; it is retried on the next deploy"

      # The VM has no access to this repo (the org turns deploy keys off), so
      # the code is sent to it: only what it lacks, as a git bundle.
      - name: Send the code to the VM
        run: |
          set -euo pipefail
          deployed=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VM" 'git -C ~/charcha rev-parse HEAD')
          if [ "$deployed" = "$GITHUB_SHA" ]; then
            echo "The VM already has $GITHUB_SHA"
            exit 0
          fi
          git branch -f deploy-ship "$GITHUB_SHA"
          if git merge-base --is-ancestor "$deployed" "$GITHUB_SHA" 2>/dev/null; then
            git bundle create deploy.bundle deploy-ship "^$deployed"
          else
            git bundle create deploy.bundle deploy-ship
          fi
          scp -q -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 deploy.bundle "$VM:charcha-deploy.bundle"

      - name: Restart on the VM (each service only when idle)
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 "$VM" \
            RESTART="'${{ steps.plan.outputs.restart }}'" bash -s <<'REMOTE'
            bash -euo pipefail -c "$(cat)" </dev/null
            set -euo pipefail
            cd ~/charcha
            if [ -f ~/charcha-deploy.bundle ]; then
              git fetch -q ~/charcha-deploy.bundle refs/heads/deploy-ship
              git checkout -q main
              git reset -q --hard FETCH_HEAD
              rm -f ~/charcha-deploy.bundle
            fi

            test -s .env || { echo "~/charcha/.env is missing"; exit 1; }
            test -s backend/.env || { echo "~/charcha/backend/.env is missing"; exit 1; }

            # Explicit release authorization includes testing board presentation.
            # Keep this server-side so the product default remains off.
            python3 - <<'PYENV'
          from pathlib import Path
          import os
          marker = Path.home() / ".deploy-state" / "agent-presentation-initialized"
          if not marker.exists():
              path = Path("backend/bot/.env")
              previous = path.read_text() if path.exists() else ""
              rows = [line for line in previous.splitlines() if not line.strip().startswith("PRESENT_BOARD=")]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("\n".join(rows) + "\nPRESENT_BOARD=1\n")
              os.chmod(path, 0o600)
              marker.parent.mkdir(mode=0o700, exist_ok=True)
              marker.write_text("Enabled for the user-authorized agent test release.\n")
              print("Enabled presentation for this test release")
          else:
              print("Preserved the server's existing presentation setting")
          PYENV

            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull -q postgres nginx certbot
            # Infrastructure (recreated only if its config changed).
            docker compose -f docker-compose.prod.yml up -d --no-build --no-deps postgres nginx certbot
            # Qdrant is rollback-only now (Pinecone serves search); its data
            # stays in the qdrant_data volume.
            docker rm -f charcha-qdrant-1 >/dev/null 2>&1 || true

            status=0
            if [ -n "$(echo $RESTART)" ]; then
              SKIP_PULL=1 SKIP_BUILD=1 MAX_WAIT_MINUTES=60 tools/deploy.sh $RESTART || status=$?
            else
              echo "No application changes to restart"
            fi
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T nginx wget -qO- http://backend:8080/health >/dev/null \
                && docker compose -f docker-compose.prod.yml exec -T nginx wget -qO- http://frontend:3000/ >/dev/null \
                && docker compose -f docker-compose.prod.yml exec -T nginx wget -qO- http://localhost/health >/dev/null; then
                docker compose -f docker-compose.prod.yml ps
                docker image prune -f >/dev/null
                if [ "$status" = 2 ]; then
                  echo "::warning::Some services were still busy (a meeting or processing) and were not restarted; the next deploy or tools/deploy.sh picks them up."
                fi
                echo "Charcha frontend and backend are healthy"
                exit 0
              fi
              sleep 5
            done

            echo "Charcha failed health checks"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=100 backend frontend nginx
            exit 1
          REMOTE

      - name: Verify the deployed agent and notetaker
        if: contains(steps.plan.outputs.restart, 'backend') || contains(steps.plan.outputs.restart, 'notetaker')
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 "$VM" bash -s <<'REMOTE'
            bash -euo pipefail -c "$(cat)" </dev/null
            set -euo pipefail
            cd ~/charcha
            for service in backend notetaker; do
              current=$(docker inspect -f '{{.Image}}' "charcha-$service-1")
              expected=$(docker image inspect -f '{{.Id}}' "charcha-$service:latest")
              test "$current" = "$expected" || { echo "$service has not restarted onto the new image"; exit 1; }
            done
            docker compose -f docker-compose.prod.yml exec -T backend python scripts/verify_agent_release.py --model-canary --voice-canary
            docker compose -f docker-compose.prod.yml exec -T notetaker python - <<'PYBOT'
          import config
          import agent_client, board_presenter, browser_voice, command_runtime, meeting_session
          from pathlib import Path
          print({"presentation_enabled": config.PRESENT_BOARD, "google_auth_state_present": config.AUTH_STATE_PATH.is_file(), "isolated_microphone_available": bool(browser_voice.SCRIPT), "runtime_imports": "ok"})
          assert config.AUTH_STATE_PATH.is_file()
          PYBOT
            docker compose -f docker-compose.prod.yml ps
          REMOTE
