server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Let's Encrypt HTTP-01 challenge — must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        error_page 502 504 = @backend_restarting;
    }

    # The backend is down for a few seconds while a deploy restarts it: say
    # so (the web app retries reads on 503) instead of a bare 502 page.
    location @backend_restarting {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"detail":"Charcha is restarting. Try again in a few seconds."}';
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
